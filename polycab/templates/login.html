<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>POLYCAB Login</title>
  <style>
    body {
      background: #f4f4f4;
      font-family: 'Arial', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card-container {
      perspective: 1000px;
    }
    .card {
      width: 500px;
      height: 450px;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      transition: transform 0.8s;
      transform-style: preserve-3d;
      position: relative;
    }
    .side {
      width: 100%;
      height: 100%;
      padding: 8px;
      position: absolute;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
      border-radius: 20px;
      background: #fff;
    }
    .back {
      transform: rotateY(180deg);
    }
    h1 {
      color: #3a2175;
      margin-bottom: 10px;
      font-weight: bold;
    }
    h2 {
      margin: 10px 0 30px;
      font-weight: bold;
      color: #6b4cb2;
    }
    input {
      width: 100%;
      padding: 12px 1px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding-left: 8px;
      font-size: 15px;
    }
  
    button {
      width: 450px;
      background: #6b4cb2;
      color: #fff;
      padding: 12px 8px;
      margin-top: 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.3s;
    }
    button:hover {
      background: #d32f2f;
    }
  </style>
</head>
<body>
<div class="card-container">
  <div class="card" id="card">
    <div class="side front">
      <h1>POLYCAB</h1>
      <h2>Login</h2>
      <form method="POST">
        {% csrf_token %}
        <div class="input">
          <input type="text" name="username" placeholder="Username or Email" required>
          <input type="password" name="password" placeholder="Password" required>
        </div>
        <button class="login_button" type="submit">Login</button>
      </form>
    </div>
</div>

</body>
</html>
