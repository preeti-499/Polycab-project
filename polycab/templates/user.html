<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task Management - My Tasks</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
      padding: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      margin-top: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    th, td {
      padding: 12px;
      border: 1px solid #ddd;
      text-align: left;
    }
    th {
      background-color: #ff5f5f;
      color: white;
    }
    .btn {
      padding: 5px 10px;
      background: #f49842;
      color: #fff;
      border: none;
      cursor: pointer;
      border-radius: 5px;
    }
    .btn:hover {
      background: #e07c10;
    }
  </style>
</head>
<body>

  <h1>All Tasks Assigned by Admin</h1>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Task Name</th>
        <th>Milestone</th>
        <th>Start Date</th>
        <th>End Date</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="taskTableBody">
      <!-- Dynamic Data will come here -->
    </tbody>
  </table>

  <script>
    async function loadTasks() {
      try {
        const response = await fetch('http://localhost/myproject/getAllTasks.php');
        const tasks = await response.json();
        
        const tbody = document.getElementById('taskTableBody');
        tbody.innerHTML = "";

        tasks.forEach(task => {
          const row = `<tr>
            <td>${task.id}</td>
            <td>${task.task_name}</td>
            <td>${task.milestone}</td>
            <td>${task.start_date}</td>
            <td>${task.end_date}</td>
            <td>${task.status}</td>
            <td><button class="btn">Update Details</button></td>
          </tr>`;
          tbody.innerHTML += row;
        });
      } catch (error) {
        console.error('Error fetching tasks:', error);
      }
    }

    window.onload = loadTasks;
  </script>

</body>
</html>
