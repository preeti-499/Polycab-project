<!DOCTYPE html>
<html>

<head>
    <title>User Management</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* General layout */
body {
    font-family: 'Segoe UI', sans-serif;
    margin: 0;
    background-color: #ECEFF1;
}

/* Header area */
.top {
    background:#ECEFF1;
    padding: 20px;
    color: rgb(13, 10, 10);
}

.top h5 {
    font-size: 24px;
    margin: 0;
}

.top p {
    margin: 0;
    font-size: 18px;
}

/* Icon buttons */
.icon-bar {
    display: flex;
    justify-content: flex-end;
    padding: 10px 20px;
    background-color: #6b4cb2;
}

.icon-btn {
    background-color: white;
    border-radius: 10px;
    padding: 10px;
    margin-left: 10px;
    font-size: 18px;
    color: #26C6DA;
    text-align: center;
    text-decoration: none;
}

/* Title */
h1 {
    text-align: center;
    margin: 30px 0 10px;
    color: #2f1668;
}

/* Add User Button */
.add-user-button {
    margin: 10px 0;
    background-color: #6b4cb2;
    color: white;
    padding: 8px 16px;
    font-size: 16px;
    border: none;
    text-decoration: none;
    border-radius: 4px;
    font-weight: bold;
    transition: background-color 0.3s ease;
    gap: 22px;
    width: fit-content;
    
}

/* Table Styles */
table {
    width: 95%;
    margin: 0 auto 40px;
    border-collapse: collapse;
    font-size: 16px;
    margin: 30px 0;
}

th, td {
    padding: 12px 15px;
    text-align: center;
}

th {
    background-color: #6b4cb2;
    color: rgb(12, 7, 7);
}

td {
    border-bottom: 1px solid #ddd;
}

tr:hover {
    background-color: #f5f5f5;
}

/* Action buttons */
.action-btn {
    margin: 0 5px;
    text-decoration: none;
    font-weight: bold;
}

.action-btn.update {
    color: green;
}

.action-btn.delete {
    color: red;
}

    </style>
</head>

<body>
    <div class="top">
        <h5>POLYCAB</h5>
        <p>Project Management System</p>
    </div>
    <div class="icon-bar">
        <a href="{% url 'admin_dashboard' %}" class="icon-btn"><i class="fas fa-user"></i></a>
        <a href="{% url 'task' %}" class="icon-btn"><i class="fas fa-bus"></i></a>
        <form method="post" action="{% url 'logout' %}" style="display: inline;">
            {% csrf_token %}
            <button type="submit" class="icon-btn" style="background: none; border: none; cursor: pointer;background-color: white;">
                <i class="fas fa-sign-out-alt" style="font-size: 24px; color:#26C6DA;"></i>
            </button>
        </form>
    </div>
    <center>
        <h1>User Management</h1>
    </center>
        <a href="{% url 'admindash' %}" class="add-user-button">Back</a>
        <a href="{% url 'add_user' %}" class="add-user-button">Add User</a>
    <center>
        <table border="1">
            <thead>
                <tr>
                    <th>S. No.</th>
                    <th>Full Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Role</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for user in users %}
                <tr>
                    <td>{{ forloop.counter }}</td>
                    <td>{{ user.full_name }}</td>
                    <td>{{ user.email }}</td>
                    <td>{{ user.phone|default:"-" }}</td>
                    <td>{{ user.role }}</td>
                    <td class="actions">
                        <a href="{% url 'update_user' user.id %}" class="action-btn update">Update</a>
                        <a href="{% url 'delete_user' user.id %}" class="action-btn delete"
                            onclick="return confirm('Are you sure you want to delete this user?');">Delete</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </center>
</body>

</html>
